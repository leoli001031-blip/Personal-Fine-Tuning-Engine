<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PFE / 本地模型工作台</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/pfe/static/studio.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand" aria-label="PFE Studio">
        <div class="brand-signature">zc</div>
        <div>
          <h1 class="brand-title">PFE / 本地模型工作台</h1>
          <div class="brand-subtitle" id="workspaceLabel">本机工作区</div>
        </div>
      </div>
      <div class="top-actions">
        <span class="status-pill" id="overallStatus">检查中</span>
        <button class="button ghost" id="refreshButton" type="button">刷新</button>
      </div>
    </header>

    <div class="workspace">
      <section class="surface surface-main" aria-labelledby="studioSummaryTitle">
        <div class="section">
          <div class="summary">
            <div class="work-order-head">
              <div>
                <div class="eyebrow">当前工作单</div>
                <h2 id="studioSummaryTitle">选择模型，拿到本机 API。</h2>
                <p class="summary-copy" id="summaryText">正在检查本机服务、模型版本和可用地址。</p>
              </div>
              <span class="status-pill" id="workOrderStatus">检查中</span>
            </div>
            <div class="work-facts" aria-label="当前状态">
              <div class="work-fact">
                <span>模型</span>
                <strong id="heroModelValue">检查中</strong>
              </div>
              <div class="work-fact">
                <span>回复</span>
                <strong id="heroReplyValue">检查中</strong>
              </div>
              <div class="work-fact">
                <span>版本</span>
                <strong id="heroVersionValue">检查中</strong>
              </div>
              <div class="work-fact">
                <span>API</span>
                <strong id="heroApiValue">检查中</strong>
              </div>
            </div>
            <div class="summary-actions">
              <button class="button primary" id="copyApiTopButton" type="button">复制 API</button>
              <button class="button" id="testHandoffButton" type="button" disabled>测试接入</button>
              <button class="button" id="openWebButton" type="button">打开网页</button>
              <button class="button" id="realLocalToggleButton" type="button" disabled>使用本地模型回复</button>
            </div>
          </div>
          <div class="workspace-control-row">
            <div class="field">
              <label for="workspaceSelect">工作区</label>
              <div class="select-wrap">
                <select id="workspaceSelect" aria-label="工作区"></select>
              </div>
            </div>
            <div class="field">
              <label for="workspaceInput">新工作区</label>
              <input class="text-input" id="workspaceInput" type="text" autocomplete="off" placeholder="client-a" />
            </div>
            <button class="button" id="saveWorkspaceButton" type="button" disabled>创建并切换</button>
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <h3 class="section-title">模型</h3>
            <span class="status-pill" id="modelStatus">检查中</span>
          </div>
          <div class="model-row">
            <div class="field">
              <label for="modelSelect">当前模型</label>
              <div class="select-wrap">
                <select id="modelSelect" aria-label="当前模型"></select>
              </div>
            </div>
            <div class="field">
              <label for="versionValue">当前版本</label>
              <div class="value-box" id="versionValue">检查中</div>
            </div>
          </div>
          <div class="path-row">
            <div class="field">
              <label class="label-row" for="modelPathInput">
                <span>模型文件夹</span>
                <span class="inline-status" id="modelPathState">检查中</span>
              </label>
              <input class="text-input" id="modelPathInput" type="text" autocomplete="off" placeholder="/Users/me/models/Qwen3-4B" />
            </div>
            <button class="button" id="saveModelPathButton" type="button">保存模型</button>
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <h3 class="section-title">地址</h3>
            <span class="status-pill" id="runtimeStatus">检查中</span>
          </div>
          <div class="endpoint-grid">
            <div class="api-card primary-card">
              <div class="api-card-head">
                <div>
                  <label for="handoffValue">接入信息</label>
                  <div class="handoff-summary" id="handoffValue">检查中</div>
                </div>
                <div class="handoff-actions">
                  <button class="button" id="copyHandoffButton" type="button" disabled>复制接入信息</button>
                </div>
              </div>
              <div class="handoff-test" id="handoffTestValue">未测试</div>
              <div class="handoff-grid">
                <div>
                  <span>网页</span>
                  <strong id="handoffWebValue">检查中</strong>
                </div>
                <div>
                  <span>聊天 API</span>
                  <strong id="handoffApiValue">检查中</strong>
                </div>
                <div>
                  <span>反馈 API</span>
                  <strong id="handoffFeedbackValue">检查中</strong>
                </div>
                <div>
                  <span>模型</span>
                  <strong id="handoffModelValue">检查中</strong>
                </div>
                <div>
                  <span>版本</span>
                  <strong id="handoffVersionValue">检查中</strong>
                </div>
              </div>
            </div>
            <div class="endpoint">
              <div>
                <label for="webUrlValue">网页</label>
                <div class="endpoint-value" id="webUrlValue">检查中</div>
              </div>
              <button class="button" data-copy-target="webUrlValue" type="button">复制网页地址</button>
            </div>
            <div class="endpoint">
              <div>
                <label for="apiUrlValue">API</label>
                <div class="endpoint-value" id="apiUrlValue">检查中</div>
              </div>
              <button class="button" data-copy-target="apiUrlValue" type="button">复制 API 地址</button>
            </div>
            <div class="api-card">
              <div class="api-card-head">
                <div>
                  <label for="apiModelValue">模型参数</label>
                  <div class="endpoint-value" id="apiModelValue">检查中</div>
                </div>
                <button class="button" data-copy-target="apiModelValue" type="button">复制 model</button>
              </div>
              <details class="api-details">
                <summary>调用示例</summary>
                <pre class="api-example" id="apiExampleValue">检查中</pre>
                <button class="button" data-copy-target="apiExampleValue" type="button">复制调用示例</button>
              </details>
            </div>
          </div>
        </div>

        <div class="section">
          <div class="section-head">
            <h3 class="section-title">状态</h3>
          </div>
          <div class="evidence-grid">
            <div class="evidence-item">
              <div class="evidence-label">本机服务</div>
              <div class="evidence-value" id="serviceValue">检查中</div>
              <div class="evidence-meta" id="serviceMeta">-</div>
            </div>
            <div class="evidence-item">
              <div class="evidence-label">模型版本</div>
              <div class="evidence-value" id="modelValue">检查中</div>
              <div class="evidence-meta" id="modelMeta">-</div>
            </div>
            <div class="evidence-item">
              <div class="evidence-label">当前回复</div>
              <div class="evidence-value" id="requestValue">检查中</div>
              <div class="evidence-meta" id="requestMeta">-</div>
            </div>
          </div>
        </div>
      </section>

      <aside class="surface" aria-labelledby="versionsTitle">
        <div class="section">
          <div class="section-head">
            <h3 class="section-title" id="versionsTitle">版本</h3>
            <span class="status-pill" id="adapterStatus">检查中</span>
          </div>
          <div class="side-list" id="versionList"></div>
        </div>
        <div class="section">
          <div class="section-head">
            <h3 class="section-title">版本生成</h3>
            <span class="status-pill" id="trainingStatus">待检查</span>
          </div>
          <div class="training-panel">
            <div class="training-value" id="trainingValue">未检查</div>
            <div class="training-meta" id="trainingMeta">-</div>
            <div class="training-meta" id="trainingJobMeta">最近任务：-</div>
            <div class="version-actions">
              <button class="button" id="trainingPreflightButton" type="button">检查条件</button>
              <button class="button primary" id="startTrainingButton" type="button" disabled>生成版本</button>
              <button class="button" id="cancelTrainingButton" type="button" disabled>停止生成</button>
              <button class="button" id="retryTrainingButton" type="button" disabled>重新生成</button>
            </div>
          </div>
        </div>
      </aside>
    </div>
    <div class="footer-signature">zc / PFE Studio</div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/pfe/static/studio.js"></script>
</body>
</html>
